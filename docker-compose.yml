# BASE stack — the services common to development and production.
#
# HOW THE THREE FILES FIT TOGETHER
#   docker-compose.yml           this file: infrastructure, backend, sync_worker
#   docker-compose.override.yml  development only; Compose loads it AUTOMATICALLY
#   docker-compose.prod.yml      production only; must be named explicitly
#
#   Development:  docker compose up -d
#                 -> base + override  (bind-mounted source, Vite dev server)
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#                 -> base + prod      (no bind mounts, built image, gunicorn)
#
# WHY THE SPLIT EXISTS
# Compose MERGES list-valued keys such as `volumes` across files rather than
# replacing them — an override specifying `volumes: []` leaves the base mounts
# in place. Verified empirically. A production override therefore cannot remove
# a development bind mount, and the only reliable way to keep host source out of
# the production containers is to declare those mounts in a file production never
# loads. That is what docker-compose.override.yml is for.

# Docker's default json-file log driver has NO size limit: a container that logs
# steadily will grow its log file until the disk is full, which takes down every
# service on the host, not just the noisy one. Every service references this.
# 10 MB x 5 files = at most 50 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Built rather than pulled so the server has a TLS certificate with the
    # ownership and permissions Postgres insists on. See docker/Dockerfile.postgres
    # for why the certificate cannot come from a bind mount.
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    restart: always
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only — internal services are never exposed on the
      # LAN. External access is exclusively through the Caddy HTTPS proxy.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - college_rag_net
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      # The qdrant image contains no curl, wget or nc — only bash. This opens a
      # raw TCP socket via bash's /dev/tcp and checks for a 200 on /healthz.
      # Verified in-container, including a negative control against a closed
      # port to confirm it actually reports failure.
      # HTTP/1.0 needs no Host header, and the request line is emitted with two
      # `echo`s rather than printf. That is deliberate: a "\n" inside a
      # YAML double-quoted scalar is parsed by YAML as a real newline before the
      # shell ever sees it, which silently breaks the request into fragments.
      # Using echo keeps the command completely free of backslash escapes.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; { echo 'GET /healthz HTTP/1.0'; echo; } >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - college_rag_net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    # WHY THIS EXISTS: sessions and the login lockout live here, NOT in Postgres.
    #
    # Resilience testing found that a Postgres outage took authentication down
    # with it, because sessions were database-backed. Every request from an
    # already-signed-in user returned 500, so the orchestrator's "database down,
    # answer from the vector store instead" path — which works, and is tested —
    # could never be reached by a real user. Moving sessions here decouples
    # "who is signed in" from "what the records say".
    command:
      - redis-server
      # PERSISTENCE IS NOT OPTIONAL HERE. Without it, restarting Redis (or the
      # host) signs out every user at once. appendfsync everysec bounds the loss
      # to about a second of session writes, which is the right trade for data
      # that is regenerated by logging in again.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # noeviction, NOT allkeys-lru. Under memory pressure an LRU policy would
      # silently delete sessions — signing users out at random, at the worst
      # possible moment, with nothing in any log to explain it. noeviction makes
      # writes fail loudly instead, which is diagnosable. Sessions carry their
      # own TTL (SESSION_COOKIE_AGE) so the keyspace drains on its own; 256 MB
      # holds far more sessions than this deployment will ever have.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    # No published port, deliberately. Redis has no authentication configured
    # and holds session identifiers, which are bearer credentials — anyone who
    # can read this keyspace can impersonate a signed-in user. It is reachable
    # only from the internal bridge network, the same posture as Qdrant.
    # To add a password, set REDIS_URL=redis://:<password>@redis:6379/0 and add
    # `--requirepass <password>` to the command above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - college_rag_net
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    restart: always
    environment:
      # KEEP MODELS RESIDENT. This is the single largest latency factor in the
      # whole system, by an order of magnitude.
      #
      # Ollama's default keep_alive is 5 MINUTES. After that it evicts the model
      # from RAM, and the next question pays a full reload from disk. Measured
      # on this machine, same question, same everything:
      #
      #     warm (models resident)   first token   6.96s    total   13.46s
      #     cold (models evicted)    first token 225.69s    total  263.44s
      #
      # 19.6x slower. On a lightly-used server — which is exactly what a college
      # assistant is outside peak hours — nearly EVERY question pays that cost,
      # because five minutes of quiet is normal.
      #
      # -1 means never evict. The cost is RAM: the three models stay resident
      # together (~7.7 GB), so OLLAMA_MEMORY_LIMIT must have room for them plus
      # KV cache. See docker-compose.prod.yml.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # Ollama will not batch beyond this many requests at once. Kept at 1 to
      # match LLM_MAX_CONCURRENCY: on CPU a second concurrent generation does not
      # run in parallel, it just splits the same cores and slows both.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # MUST MATCH OLLAMA_NUM_CTX in the backend (common/ollama.py).
      #
      # Ollama loads a model at whatever context the FIRST request asks
      # for. Warming with the CLI (which sends no num_ctx) loaded the 7B at
      # the server default of 4096, and the app's first real request at
      # 8192 then RELOADED it — so the warm-up bought nothing and the first
      # user still waited for a cold load. Observed directly: `ollama ps`
      # showed CONTEXT 4096 after warming, 8192 after the first question.
      #
      # Setting the server default makes the CLI and the application agree,
      # so the model is loaded once, at the right size.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-8192}
      # MEASURED AND REJECTED — do not re-add without re-measuring.
      #
      # OLLAMA_FLASH_ATTENTION=1 together with OLLAMA_KV_CACHE_TYPE=q8_0 was
      # tried here to cut prompt-processing time. Median synthesis prompt read
      # over four identical-shape calls, same machine, minutes apart:
      #
      #     default (f16 KV, no flash attention)    6,057 ms
      #     flash attention + q8_0 KV cache        10,650 ms   <- 1.76x WORSE
      #
      # Both are optimisations for GPU kernels. On this CPU-only deployment they
      # cost time rather than saving it, and the quantised cache also adds a
      # dequantise step on every attention read. Recorded here because "enable
      # flash attention" is the obvious next thing anyone will try.
    volumes:
      - ollama_data:/root/.ollama
    # No host port published: Ollama is internal-only, reached by the backend
    # and sync_worker over the docker network at http://ollama:11434. (Not
    # publishing it also avoids colliding with a desktop Ollama app on the host.)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - college_rag_net
    logging: *default-logging

  # One-shot helper: downloads the AI models into the shared ollama volume the
  # first time the stack starts, so nobody has to run `ollama pull` by hand.
  # On later starts the models are already cached, so this finishes instantly.
  # It exits when done (not a long-running service), hence restart: "no".
  #
  # The download is ~5 GB on first run, so a transient network hiccup mid-pull
  # is a real risk. The loop below retries each model up to 5 times (ollama
  # resumes from cached layers, so a retry doesn't re-download what already
  # landed) and only gives up — loudly — after that. Models are read from the
  # same env vars the app uses, so switching models is a one-place change.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # EVERY model variable the application reads is passed through, and the
      # list of what to pull is DERIVED from them by backend/scripts/required_models.sh
      # rather than written out again here.
      #
      # It used to be a hand-written list of the three below, while the app read
      # six. ROUTER_MODEL was missing and has its OWN default (qwen2.5:3b, not
      # LLM_MODEL), so on a default deployment a model the router needs was
      # never fetched — and common/ollama.py counts it as required-resident, so
      # /api/health/ reports "loading qwen2.5:3b" and 503s forever. It worked
      # only because VERIFICATION_MODEL happened to be set to the same value.
      # See the header of backend/scripts/required_models.sh for the measurements.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      # Usually a SMALLER model than LLM_MODEL: verification cannot stream and
      # must read the whole answer plus all evidence, so on CPU it is the
      # slowest step. Pulled here so a fresh server does not fail its first
      # verification with "model not found". Empty is fine — blank means "use
      # LLM_MODEL", and the enumeration deduplicates.
      VERIFICATION_MODEL: ${VERIFICATION_MODEL:-}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-}
      SQL_AGENT_MODEL: ${SQL_AGENT_MODEL:-}
      ROUTER_MODEL: ${ROUTER_MODEL:-}
    volumes:
      # The single source of truth for which models this deployment needs.
      # backend/common/tests.py fails if it ever disagrees with the readiness
      # check in common/ollama.py.
      - ./backend/scripts/required_models.sh:/usr/local/bin/required_models.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODELS="$$(sh /usr/local/bin/required_models.sh)"
        CHAT_MODELS="$$(sh /usr/local/bin/required_models.sh --chat)"
        echo "This deployment needs: $$(echo $$MODELS | tr '\n' ' ')"

        for model in $$MODELS; do
          echo "Downloading $$model (first run can take several minutes)..."
          n=0
          until ollama pull "$$model"; do
            n=$$((n + 1))
            if [ "$$n" -ge 5 ]; then
              echo "ERROR: could not download $$model after 5 attempts. Check the server's internet connection, then run 'docker compose up -d' again."
              exit 1
            fi
            echo "Download of $$model failed (attempt $$n/5) — retrying in 15s..."
            sleep 15
          done
        done

        # DOWNLOADED IS NOT LOADED, AND THE DIFFERENCE IS ~15 MINUTES.
        #
        # `ollama pull` puts a model on disk. The first REQUEST for it then
        # loads it into memory, which on CPU-only hardware takes minutes — and
        # OLLAMA_READ_TIMEOUT usually fires first, so the first several
        # questions after a deployment fail with "The AI service is temporarily
        # unavailable" on a system that is working correctly. Measured on the
        # reference machine: 15m23s to load the 7B and 3B.
        #
        # Loading them here moves that wait into deployment, where somebody is
        # watching a log, instead of into the first user's first question.
        #
        # Uses the CLI, not an HTTP call: this image ships neither wget nor
        # curl. A first version used `wget --post-data` and failed silently on
        # every model for exactly that reason.
        for model in $$CHAT_MODELS; do
          echo "Loading $$model into memory (several minutes on CPU; this is the wait that would otherwise hit your first user)..."
          ollama run "$$model" "hi" >/dev/null 2>&1 || true
        done

        # VERIFY RESIDENCY, DO NOT ANNOUNCE IT.
        #
        # The previous version printed "All AI models are ready" unconditionally,
        # including on the run where every preload had just failed. That is the
        # same defect this whole change exists to fix — a component reporting
        # ready when it is not — so this checks `ollama ps` and says which
        # models are actually in memory.
        MISSING=""
        for model in $$CHAT_MODELS; do
          ollama ps 2>/dev/null | grep -q "$$model" || MISSING="$$MISSING $$model"
        done
        if [ -n "$$MISSING" ]; then
          echo "WARNING: these models are downloaded but NOT resident:$$MISSING"
          echo "They will load on the first question, which may time out. The health"
          echo "endpoint reports 'warming' and returns 503 until they are in memory."
        else
          echo "All AI models are downloaded AND resident. The system is ready to answer."
        fi
    restart: "no"
    networks:
      - college_rag_net
    logging: *default-logging

  # ============================================================================
  # UNATTENDED BACKUPS
  # ============================================================================
  # The documented procedure used to be "add a line to crontab". The production
  # audit then found the entry had never been installed, and
  # verify_deployment.sh has failed on stale backups ever since. A manual step
  # is indistinguishable, from outside, from a forgotten one — and a product a
  # stranger installs cannot depend on them remembering.
  #
  # Uses the SAME image as postgres, so pg_dump is guaranteed to match the
  # server version. A pg_dump older than the server refuses to run at all.
  #
  # NO DOCKER SOCKET. scripts/backup.sh shells out to `docker compose exec`,
  # which from inside a container would need /var/run/docker.sock — effectively
  # root on the host, in exchange for a cron replacement. This talks to Postgres
  # over the internal network and to Qdrant over HTTP, needing no privilege
  # beyond reaching two services it already shares a network with.
  #
  # scripts/backup.sh is unchanged and remains the operator's manual tool.
  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-college_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-college_docs}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # 14 days of daily backups. Long enough to notice a corruption that took a
      # week to surface; short enough that the disk does not fill silently.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/scheduled_backup.sh:/usr/local/bin/scheduled_backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/scheduled_backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - college_rag_net
    logging: *default-logging

  backend:
    build:
      context: ./backend
      # Overridden to "production" by docker-compose.prod.yml. Named explicitly
      # in both files so neither depends on Dockerfile stage ordering.
      target: development
    restart: always
    env_file:
      # OPTIONAL, deliberately. Development always has a .env and relies on it
      # (docker-compose.override.yml still requires one). PRODUCTION does not:
      # it is configured entirely from .env.production, passed both as an
      # env_file below and via --env-file for ${VAR} interpolation.
      #
      # This was `- .env`, which the Compose spec treats as REQUIRED. On a fresh
      # server following DEPLOYMENT.md — which only ever creates
      # .env.production — every single compose command failed outright with
      # "env file .env not found". Making it optional means production needs no
      # file full of example secrets sitting next to the real ones.
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      # Sessions, the login lockout and the DRF throttles all live here.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SERVER_HOST: ${SERVER_HOST:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The one file a college fills in: name, logo, colours, contact address
      # and the web-fetch allowlist. See config/institution.example.json.
      INSTITUTION_CONFIG: /etc/college-assistant/institution.json
      # The one place the college's physical table names are recorded.
      # Mounted from the same directory as institution.json rather than
      # resolved relative to the source tree: the repo-relative default in
      # common/schema_map.py points at <repo>/config, which does not exist
      # inside the image (the backend is COPYed to /app, so /app/../config
      # resolves to /config and is empty).
      SCHEMA_MAP: /etc/college-assistant/schema_map.json
      # Demo data is OPT-IN. A production install starts empty and is populated
      # by the operator's own import; shipping 13,000 rows of invented faculty
      # into a real deployment would be indefensible. Set true for an evaluation
      # or a training environment.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      # NOT read-only: first-run setup writes institution.json here, which is
      # the whole point of having a setup step rather than a documented file to
      # hand-edit. Mounted in the BASE file so production gets it too — the
      # production image bakes in ./backend, and config/ is outside that build
      # context, so without this mount a production container would fall back to
      # the built-in defaults and quietly have no institution name.
      # MOUNTED OUTSIDE /app, and that is not a style choice. The Django
      # project package is itself called `config` (backend/config/settings/),
      # so mounting the host's ./config at /app/config shadowed it and the
      # backend died on start with "No module named 'config.settings'".
      - ./config:/etc/college-assistant
    ports:
      # 127.0.0.1 only: reachable from the server itself for diagnostics, never
      # from the network. Deliberately kept in production too — it is not a
      # network exposure, and it makes on-server troubleshooting possible.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # Liveness only (backend process is serving). Uses /api/health/live/ so a
      # downstream outage (e.g. Ollama) never marks the backend itself
      # unhealthy — the aggregate /api/health/ is for monitoring, not liveness.
      #
      # X-Forwarded-Proto MATTERS AND IS NOT OPTIONAL. In production
      # SECURE_SSL_REDIRECT is on, so a plain-HTTP probe is answered with a 301
      # to https://localhost:8000 — which is not a TLS port, so urlopen hangs
      # until the 5s timeout and the probe fails FOREVER. The backend then never
      # reports healthy, and because caddy waits on `service_healthy`, Caddy
      # never starts and the whole deployment is dead. This header makes the
      # probe present itself the way Caddy does. Harmless in development, where
      # there is no redirect to trip over.
      #
      # The explicit timeout keeps a hung probe inside the 5s healthcheck window
      # instead of relying on urlopen's default (no timeout at all).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/health/live/', headers={'X-Forwarded-Proto': 'https'}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - college_rag_net
    logging: *default-logging

  sync_worker:
    build:
      context: ./sync_worker
      target: development
    restart: always
    healthcheck:
      # The sync worker has no port to probe, so liveness is inferred from its
      # WORK: it rewrites state.json at the end of every poll cycle.
      #
      # This matters because the failure mode is silent. A worker that is
      # running but no longer syncing looks identical to a healthy one from
      # `docker compose ps` — the container is up, nothing has crashed, and the
      # search index simply stops reflecting the database. Without this, the
      # only symptom is stale answers, noticed days later.
      #
      # The threshold is generous (3x the 30s poll interval) so a slow cycle
      # under load is not mistaken for a dead one.
      test: ["CMD-SHELL", "test -f data/state.json && test $(( $(date +%s) - $(stat -c %Y data/state.json) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    env_file:
      # OPTIONAL, deliberately. Development always has a .env and relies on it
      # (docker-compose.override.yml still requires one). PRODUCTION does not:
      # it is configured entirely from .env.production, passed both as an
      # env_file below and via --env-file for ${VAR} interpolation.
      #
      # This was `- .env`, which the Compose spec treats as REQUIRED. On a fresh
      # server following DEPLOYMENT.md — which only ever creates
      # .env.production — every single compose command failed outright with
      # "env file .env not found". Making it optional means production needs no
      # file full of example secrets sitting next to the real ones.
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Wait for the backend so migrations + the rag_agent_ro role exist before
      # the worker tries to read as that role.
      backend:
        condition: service_healthy
    networks:
      - college_rag_net
    logging: *default-logging

networks:
  college_rag_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  caddy_data:
  caddy_config:
